# separate terms of service, privacy policy, and support
# documentation.

name: Dart

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  flutter-ci:
    name: Flutter analyze & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pinned to the v2.23.0 commit SHA of subosito/flutter-action for
      # reproducible builds. The action installs Flutter into PATH; pin to the
      # project's stable channel + the version recorded in CONTEXT.md.
      # See https://github.com/subosito/flutter-action
      - name: Install Flutter (stable)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: "3.44.8"

      # Cache pub dependencies keyed on pubspec.lock so flutter pub get is fast
      # on repeat runs. Restored into the location Flutter uses (~/.pub-cache).
      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-cache-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-cache-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      # --no-fatal-infos is enabled: prefer_initializing_formals lints
      # have been cleaned up, but legitimate new code (e.g. the demo
      # script) emits `avoid_print` info lints that are correct for that
      # context. Keep analyze strict on warnings/errors.
      - name: Analyze project source
        run: flutter analyze --no-fatal-infos

      # flutter_test (widget tests) requires the Flutter runtime, not
      # `dart test`.
      - name: Run tests
        run: flutter test